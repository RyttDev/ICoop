<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iCOOP - Daftar Akaun</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            DEFAULT: '#0f766e', // Warna hijau iCOOP
                            hover: '#115e59',
                            light: '#e6f4f1'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#f2f7f6] min-h-screen flex flex-col justify-between items-center py-8 px-4 font-sans antialiased">

    <!-- Container Utama -->
    <div class="w-full max-w-md flex flex-col items-center my-auto">
        
        <!-- Logo iCOOP -->
        <div class="flex items-center space-x-2 mb-8">
            <div class="bg-brand text-white font-extrabold text-lg w-9 h-9 rounded-md flex items-center justify-center shadow-sm">
                i
            </div>
            <span class="text-brand font-extrabold text-3xl tracking-tight">iCOOP</span>
        </div>

        <!-- Kad Borang Pendaftaran -->
        <div class="bg-white w-full rounded-2xl shadow-sm border border-gray-100 p-8 sm:p-10">
            
            <!-- Tajuk -->
            <div class="mb-6">
                <span class="text-[11px] font-bold text-brand uppercase tracking-wider">AKAUN BAHARU</span>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900 mt-1 tracking-tight">Daftar akaun</h1>
                <p class="text-xs sm:text-sm text-gray-500 mt-1">Cipta akaun untuk mula menggunakan iCOOP.</p>
            </div>

            <!-- Borang -->
            <form action="#" method="POST" class="space-y-4">
                
                <!-- Input: Nama Penuh -->
                <div>
                    <label for="fullname" class="block text-xs font-bold text-gray-700 mb-1.5">Nama penuh</label>
                    <input type="text" id="fullname" name="fullname" required
                        class="w-full px-3.5 py-2.5 text-sm rounded-lg border-2 border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500/20 text-gray-900 placeholder-gray-400 transition"
                        placeholder="">
                </div>

                <!-- Input: E-mel -->
                <div>
                    <label for="email" class="block text-xs font-bold text-gray-700 mb-1.5">E-mel</label>
                    <input type="email" id="email" name="email" required
                        class="w-full px-3.5 py-2.5 text-sm rounded-lg border border-gray-200 focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 text-gray-900 transition">
                </div>

                <!-- Input: Kata Laluan -->
                <div>
                    <label for="password" class="block text-xs font-bold text-gray-700 mb-1.5">Kata laluan</label>
                    <input type="password" id="password" name="password" minlength="8" required
                        class="w-full px-3.5 py-2.5 text-sm rounded-lg border border-gray-200 focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 text-gray-900 transition">
                    <p class="text-[11px] text-gray-400 mt-1">Minimum 8 aksara.</p>
                </div>

                <!-- Input: Sahkan Kata Laluan -->
                <div>
                    <label for="password_confirmation" class="block text-xs font-bold text-gray-700 mb-1.5">Sahkan kata laluan</label>
                    <input type="password" id="password_confirmation" name="password_confirmation" minlength="8" required
                        class="w-full px-3.5 py-2.5 text-sm rounded-lg border border-gray-200 focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 text-gray-900 transition">
                </div>

                <!-- Butang Daftar Akaun -->
                <div class="pt-2">
                    <button type="submit" 
                        class="w-full bg-brand hover:bg-brand-hover text-white font-semibold py-3 px-4 rounded-lg text-sm shadow-sm transition duration-200 focus:outline-none focus:ring-2 focus:ring-brand focus:ring-offset-2">
                        Daftar akaun
                    </button>
                </div>
            </form>

            <!-- Pautan Log Masuk -->
            <div class="mt-6 text-center text-xs text-gray-500">
                Sudah mempunyai akaun? <a href="#" class="font-bold text-brand hover:underline">Log masuk</a>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-8 text-center text-xs text-gray-400">
        Sistem Pengurusan Koperasi iCOOP
    </footer>

</body>
</html>
